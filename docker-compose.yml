services:
  postgres:
    image: postgres:16
    container_name: vendaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banco1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vendaflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banco1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vendaflow_postgres_data:
