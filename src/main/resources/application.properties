spring.application.name=vendaflow-backend

# Carrega .env quando a aplicação é iniciada pela IDE ou pelo Maven.
# Variáveis do sistema/ambiente continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]

# Runtime
server.port=${SERVER_PORT:8080}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}

# PostgreSQL existente do projeto inicial
# DB_URL deve usar o formato JDBC; não use a URL do Node DATABASE_URL aqui.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banco1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate cria e atualiza tabelas/relacionamentos das entidades sem apagar os dados.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
